<!DOCTYPE html>
<html>
<head>
    <title>测试图片</title>
</head>
<body>
    <h1>测试民崛产品图片</h1>
    <img src="/MinJue/products/minjue-product-1.png" style="width:300px" />
    <p>图片路径: /MinJue/products/minjue-product-1.png</p>
    
    <script>
        const img = document.querySelector('img');
        img.onload = () => console.log('图片加载成功！尺寸:', img.naturalWidth, 'x', img.naturalHeight);
        img.onerror = () => console.error('图片加载失败！完整URL:', img.src);
    </script>
</body>
</html>
